<!--
  Plantilla «Dos columnas»: comparar o contrastar (por ejemplo, «Incluye» y «No incluye»),
  o un gráfico a la izquierda y su lectura a la derecha.
  - Máximo 4 ideas entre las dos columnas.
  - La columna derecha aparece en un segundo paso (data-fragment="1"); quítalo si no hace falta.
-->
<div class="plantilla plantilla-dos-columnas">
  <h2 class="plantilla__titulo">Título de la lámina</h2>
  <div class="plantilla__cuerpo">
    <div class="columna">
      <h3 class="columna__titulo">Columna izquierda</h3>
      <ul class="lista-ideas">
        <li>Primera idea</li>
        <li>Segunda idea</li>
      </ul>
    </div>
    <div class="columna" data-fragment="1">
      <h3 class="columna__titulo">Columna derecha</h3>
      <ul class="lista-ideas">
        <li>Tercera idea</li>
        <li>Cuarta idea</li>
      </ul>
    </div>
  </div>
  <p class="plantilla__pie">Fuente o nota</p>
</div>

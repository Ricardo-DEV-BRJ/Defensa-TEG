<!--
  Plantilla «Portada».
  - Solo para la lámina 1 (y, adaptada, la 16): el isologo UVM únicamente va en esas dos.
  - El isologo se usa completo: sin width/height en línea, sin recortar ni recolorear.
-->
<div class="plantilla-portada">
  <img class="isologo" src="img/uvm-isologo.png" alt="Isologo de la Universidad Valle del Momboy" />
  <div class="plantilla-portada__texto">
    <p class="plantilla-portada__institucion">Universidad · Facultad · Carrera</p>
    <h1 class="plantilla-portada__titulo">
      Título completo del trabajo especial de grado, tal como aparece en la portada del documento
      aprobado
    </h1>
    <dl class="plantilla-portada__personas">
      <div>
        <dt>Autores</dt>
        <dd>Nombre Apellido · Nombre Apellido</dd>
      </div>
      <div>
        <dt>Tutora</dt>
        <dd>Nombre Apellido</dd>
      </div>
    </dl>
    <p class="plantilla-portada__lugar">Ciudad, año</p>
  </div>
</div>

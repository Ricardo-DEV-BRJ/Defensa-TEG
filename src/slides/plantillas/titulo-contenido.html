<!--
  Plantilla «Título + contenido»: un título y hasta 4 ideas.
  - data-fragment="n" hace aparecer cada idea paso a paso; el mismo n aparece junto.
  - Para un texto corrido, cambia la lista por <p class="plantilla__cuerpo parrafo">…</p>.
  - El pie es opcional (fuente o nota); si no se usa, bórralo.
-->
<div class="plantilla">
  <h2 class="plantilla__titulo">Título de la lámina: una pregunta o una afirmación</h2>
  <ul class="plantilla__cuerpo lista-ideas">
    <li data-fragment="1">Primera idea, en una o dos líneas como máximo</li>
    <li data-fragment="2">Segunda idea con un <strong>término destacado</strong></li>
    <li data-fragment="3">Tercera idea</li>
    <li data-fragment="4">Cuarta idea: no agregues una quinta</li>
  </ul>
  <p class="plantilla__pie">Fuente o nota</p>
</div>

<!--
  Lámina 13 · Estructura del modelo y arquitectura (plantilla «Título + contenido» con el
  bloque «arquitectura»). Demostración clave (★).
  Pregunta guía: ¿Qué es AgroData JM y cómo fluyen los datos?
  Las cinco capas y los dos componentes transversales desde data/arquitectura.json (TEG
  Tabla 19 y Figura 15). Las capas se apilan de abajo (captura) hacia arriba (visualización)
  y aparecen en ese orden, una por paso; al final, los transversales.
  Componente data-flow (src/components/data-flow.js, ADR-011): al aparecer cada capa, una ráfaga
  de paquetes sube por la flecha hasta ella (clic en la flecha la repite); clic en una capa la
  amplía con sus componentes. data-capa = número de la capa (1 = captura).
  Cada componente lleva data-vars con prototipo=…en_prototipo.i: 1 = ya funciona en el prototipo
  del Anexo 20, 0 = se implementa por fases (Cap. VI). El pie explica las dos marcas (ADR-019).
  Los tres pilares, la base de datos y el despliegue se dicen (notas).
-->

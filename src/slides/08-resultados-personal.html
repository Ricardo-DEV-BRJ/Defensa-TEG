<!--
  Lámina 8 · Lo que dijo el personal operativo (plantilla «Título + contenido» con el componente
  «bar-chart»).
  Pregunta guía: ¿Qué percibe el personal sobre el registro de datos y lo que necesita?
  Componente bar-chart (src/components/bar-chart.js, ADR-014): barras horizontales en SVG con el
  % de acuerdo de los ítems marcados con destacado_lamina_8 en data/likert.json, de mayor a menor;
  data-grupo elige los de grupo_lamina_8. Las barras crecen al aparecer su paso.
  Paso 1: lo que necesitan. Paso 2: cómo están hoy.
  Junto a la barra se muestra el desacuerdo cuando pesa más que el acuerdo (1.1: 75%; 2.6: 50%).
  La redacción completa de los 15 ítems va en la lámina de reserva 18.
-->
<div class="plantilla">
  <h2 class="plantilla__titulo">Lo que dijo el personal operativo</h2>
  <div class="plantilla__cuerpo apilado apilado--compacto">
    <p class="nota">
      Porcentaje del personal de acuerdo o totalmente de acuerdo con cada afirmación
    </p>

    <div data-fragment="1">
      <p class="etiqueta">Lo que necesitan</p>
      <div class="barras" data-componente="bar-chart" data-grupo="1"></div>
    </div>

    <div data-fragment="2">
      <p class="etiqueta">Cómo están hoy</p>
      <div class="barras" data-componente="bar-chart" data-grupo="2"></div>
    </div>
  </div>
  <p class="plantilla__pie">
    n = <span data-dato="likert.n"></span> · <span data-dato="likert.nota"></span>
  </p>
</div>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universidad Valle del Momboy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
<style>
  /* Paleta del Manual de Identidad UVM */
  :root {
    --teal: #1d555b;      /* Teal Momboy */
    --verde: #88c426;     /* Verde Higuerón */
    --celeste: #bcd4de;   /* Celeste Valle */
    --oliva: #809e3e;     /* Verde Oliva */
    --rojo: #860000;      /* Rojo Semilla */
    --papel: #fbfbf8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papel); color: var(--teal);
         font-family: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; }

  /* Cabecera con la animación */
  .hero { position: relative; height: 100vh; height: 100svh; overflow: hidden; touch-action: pan-y;
          background: radial-gradient(circle at 50% 42%, rgba(188, 212, 222, .16) 0, rgba(188, 212, 222, 0) 58%),
                      var(--teal); }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .lema { position: absolute; left: 0; right: 0; bottom: 8%; padding: 0 16px;
          text-align: center; pointer-events: none; }
  .lema p { margin: 0; font-size: clamp(1.25rem, 2.8vw, 1.75rem); color: var(--papel); letter-spacing: .02em; }
  .lema small { display: block; margin-top: .5rem; font-size: .9rem; color: var(--celeste); opacity: .7;
                letter-spacing: .12em; text-transform: uppercase; }

  /* Resto de la página (ejemplo) */
  .siguiente { max-width: 720px; margin: 0 auto; padding: 80px 16px; font-size: 1.25rem; line-height: 1.3; }
  .siguiente h2 { margin: 0 0 .4em; font-size: 2.5rem; font-weight: 700; }
  .siguiente h2::after { content: ""; display: block; width: 64px; height: 3px; margin-top: .35em; background: var(--verde); }
</style>
</head>
<body>

<header class="hero" id="hero">
  <canvas id="lienzo" aria-hidden="true"></canvas>
  <div class="lema">
    <p>Tecnología y métricas que impulsan su organización</p>
    <small>Mueva el cursor · haga clic o toque para dispersar</small>
  </div>
</header>

<section class="siguiente">
  <h2>El resto de su página</h2>
  <p>La animación vive solo en la cabecera y se pausa sola cuando el usuario hace scroll fuera de ella.</p>
</section>

class PuntoLogo {
  constructor(objetivo) {
    this.x = Math.random() * ancho;
    this.y = Math.random() * alto;
    this.vx = this.vy = 0;
    this.k = aleatorio(0.025, 0.06);
    this.fase = Math.random() * Math.PI * 2;
    this.asignar(objetivo);
  }
  asignar(o) { this.tx = o.x; this.ty = o.y; this.color = o.color; }

  actualizar(t) {
    const ox = Math.sin(t * 0.0015 + this.fase) * 0.35;  // el logo "respira"
    const oy = Math.cos(t * 0.0013 + this.fase) * 0.35;

    this.vx += (this.tx + ox - this.x) * k;
    this.vy += (this.ty + oy - this.y) * k;

    if (raton.x !== null) {                               // el cursor las aparta
      const dx = this.x - raton.x, dy = this.y - raton.y;
      const d2 = dx * dx + dy * dy, R = CONFIG.radioRaton;
      if (d2 < R * R && d2 > 0.01) {
        const d = Math.sqrt(d2), f = (1 - d / R) * 2.2;
        this.vx += (dx / d) * f;
        this.vy += (dy / d) * f;
      }
    }
    this.vx *= 0.86;
    this.vy *= 0.86;
    this.x += this.vx;
    this.y += this.vy;
  }
}

// =====================================================================
// 4. ICONO FLOTANTE (o etiqueta de métrica)
// =====================================================================
class Icono {
  constructor() {
    this.esTexto = CONFIG.metricas.length > 0 && (caminos.length === 0 || Math.random() < 0.25);
    if (this.esTexto) {
      this.texto = elegir(CONFIG.metricas);
      this.color = elegir(CONFIG.coloresMetricas);
    } else {
      this.camino = elegir(caminos);
      this.color = CONFIG.colorIconos;
      this.anillo = Math.random() < CONFIG.anillos;
    }
    this.x = Math.random() * ancho;
    this.y = Math.random() * alto;
    const ang = Math.random() * Math.PI * 2, vel = aleatorio(0.15, 0.45);
    this.vx = Math.cos(ang) * vel;
    this.vy = Math.sin(ang) * vel;
    this.tam = aleatorio(20, 34) * (this.anillo ? 1.25 : 1);
    this.rot = aleatorio(-0.3, 0.3);
    this.vrot = aleatorio(-0.002, 0.002);
    this.alfa = aleatorio(0.3, 0.7);
    this.atenuado = 1;
  }

  actualizar() {
    if (raton.x !== null) {
      const dx = this.x - raton.x, dy = this.y - raton.y;
      const d = Math.hypot(dx, dy), R = CONFIG.radioRaton * 1.4;
      if (d > 0 && d < R) {
        const f = ((R - d) / R) * 2.5;
        this.x += (dx / d) * f;
        this.y += (dy / d) * f;
      }
    }
    this.x += this.vx;
    this.y += this.vy;
    this.rot += this.vrot;
    const m = this.tam * 1.3;
    if (this.x < -m) this.x = ancho + m; else if (this.x > ancho + m) this.x = -m;
    if (this.y < -m) this.y = alto + m;  else if (this.y > alto + m) this.y = -m;

    const z = zonaLogo;
    const dentro = z && ((this.x - z.cx) / z.rx) ** 2 + ((this.y - z.cy) / z.ry) ** 2 < 1;
    this.atenuado += ((dentro ? 0.1 : 1) - this.atenuado) * 0.08;
  }

  dibujar() {
    ctx.save();
    ctx.globalAlpha = this.alfa * this.atenuado;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    if (this.esTexto) {
      ctx.fillStyle = this.color;
      ctx.font = `700 ${Math.round(this.tam * 0.8)}px ${FUENTE}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.texto, 0, 0);
    } else {
      const s = this.tam / 24;
      ctx.scale(s, s);
      ctx.strokeStyle = this.color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      let interior = 1;
      if (this.anillo) {                       // anillo contenedor
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.stroke();
        interior = 0.66;
        ctx.scale(interior, interior);
      }
      ctx.translate(-12, -12);
      ctx.lineWidth = 2 / interior;
      ctx.stroke(this.camino);
    }
    ctx.restore();
  }
}

// =====================================================================
// 5. CONVERTIR EL LOGO EN PUNTOS
//    Se dibuja el logo reducido en un canvas oculto: cada píxel de esa
//    versión pequeña es una celda, y si el logo la cubre, nace una partícula
//    con su color. Las celdas de borde (cobertura parcial) dan partículas
//    semitransparentes: es un suavizado que mantiene legible el texto del anillo.
// =====================================================================
function leerPixeles(w, h) {
  muestreo.width = w;
  muestreo.height = h;
  mctx.imageSmoothingEnabled = true;
  mctx.imageSmoothingQuality = 'high';
  mctx.drawImage(imagenLogo, 0, 0, w, h);
  try {
    return mctx.getImageData(0, 0, w, h).data;
  } catch (e) {
    console.warn('No se pudieron leer los píxeles del logo. Si usa una ruta y abrió el archivo con ' +
                 'doble clic (file://), el navegador lo bloquea: use un servidor local (Live Server ' +
                 'de VS Code o "npx serve").');
    imagenLogo = null;
    return null;
  }
}

function calcularObjetivos() {
  zonaLogo = null;
  if (!imagenLogo) return [];
  const movil = ancho < 700;
  const maxW = ancho * (movil ? CONFIG.logo.anchoMaxMovil : CONFIG.logo.anchoMax);
  const maxH = alto * CONFIG.logo.altoMax;
  const iw = imagenLogo.naturalWidth || 300, ih = imagenLogo.naturalHeight || 300;
  const s = Math.min(maxW / iw, maxH / ih);
  const w = iw * s, h = ih * s;
  const x0 = ancho / 2 - w / 2, y0 = alto * CONFIG.logo.centroY - h / 2;

  // 1) Medir cuánta superficie ocupa el logo para elegir el tamaño de celda
  let datos = leerPixeles(Math.max(1, Math.round(w / 2)), Math.max(1, Math.round(h / 2)));
  if (!datos) return [];
  let llenos = 0;
  for (let i = 3; i < datos.length; i += 4) if (datos[i] > 128) llenos++;
  const max = CONFIG.logo.maxParticulas * (movil ? 0.45 : 1);
  const paso = Math.max(2, Math.sqrt((llenos * 4) / max));
  tamPunto = Math.max(1.4, paso * 0.9);

  // 2) Logo reducido: 1 píxel = 1 celda de "paso" px
  const gw = Math.max(1, Math.round(w / paso)), gh = Math.max(1, Math.round(h / paso));
  datos = leerPixeles(gw, gh);
  if (!datos) return [];
  const cx = w / gw, cy = h / gh;
  const objetivos = [];
  for (let j = 0; j < gh; j++) {
    for (let i = 0; i < gw; i++) {
      const k = (j * gw + i) * 4;
      if (datos[k + 3] > CONFIG.logo.umbral) {
        objetivos.push({
          x: x0 + (i + 0.5) * cx,
          y: y0 + (j + 0.5) * cy,
          color: CONFIG.logo.colores
            ? elegir(CONFIG.logo.colores)
            : `rgba(${datos[k]}, ${datos[k + 1]}, ${datos[k + 2]}, ${(datos[k + 3] / 255).toFixed(2)})`,
        });
      }
    }
  }
  zonaLogo = { cx: x0 + w / 2, cy: y0 + h / 2, rx: w / 2 + 24, ry: h / 2 + 24 };

  for (let i = objetivos.length - 1; i > 0; i--) {     // mezclar: ensamblado más orgánico
    const j = Math.floor(Math.random() * (i + 1));
    [objetivos[i], objetivos[j]] = [objetivos[j], objetivos[i]];
  }
  return objetivos;
}

function aplicarObjetivos(objetivos) {
  objetivos.forEach((o, i) => puntos[i] ? puntos[i].asignar(o) : puntos.push(new PuntoLogo(o)));
  puntos.length = objetivos.length;
}

function ajustarIconos() {
  const cantidad = Math.max(8, Math.round((ancho * alto) / CONFIG.densidadIconos));
  while (iconos.length < cantidad) iconos.push(new Icono());
  iconos.length = cantidad;
}

// =====================================================================
// 6. DIBUJO
// =====================================================================
function dibujarRed() {
  const max = CONFIG.distanciaRed;
  if (!max) return;
  ctx.lineWidth = 1;
  for (let i = 0; i < iconos.length; i++) {
    for (let j = i + 1; j < iconos.length; j++) {
      const a = iconos[i], b = iconos[j];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < max) {
        const alfa = (1 - d / max) * 0.22 * Math.min(a.atenuado, b.atenuado);
        ctx.strokeStyle = `rgba(${CONFIG.colorRed}, ${alfa})`;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
  }
}

function dibujar() {
  ctx.clearRect(0, 0, ancho, alto);
  dibujarRed();
  for (const ic of iconos) ic.dibujar();
  const m = tamPunto / 2;
  for (const p of puntos) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - m, p.y - m, tamPunto, tamPunto);
  }
}

function actualizar(t) {
  retorno = Math.min(1, retorno + 0.012);
  for (const ic of iconos) ic.actualizar();
  for (const p of puntos) p.actualizar(t);
}

// =====================================================================
// 7. TAMAÑO, BUCLE Y EVENTOS
// =====================================================================
function redimensionar() {
  const r = hero.getBoundingClientRect();
  ancho = Math.round(r.width);
  alto = Math.round(r.height);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = ancho * dpr;
  canvas.height = alto * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  aplicarObjetivos(calcularObjetivos());
  ajustarIconos();
  if (reducirMovimiento) {
    for (const p of puntos) { p.x = p.tx; p.y = p.ty; }
    dibujar();
  }
}

let visible = true, animando = false;
function bucle(t) {
  if (!visible) { animando = false; return; }
  actualizar(t);
  dibujar();
  requestAnimationFrame(bucle);
}
function arrancar() {
  if (animando || reducirMovimiento) return;
  animando = true;
  requestAnimationFrame(bucle);
}

function posicion(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

hero.addEventListener('pointermove', e => Object.assign(raton, posicion(e)));
hero.addEventListener('pointerleave', () => { raton.x = raton.y = null; });
hero.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') raton.x = raton.y = null; });
hero.addEventListener('pointercancel', () => { raton.x = raton.y = null; });

// Clic / toque: el logo se dispersa y se vuelve a armar
hero.addEventListener('pointerdown', e => {
  const { x, y } = posicion(e);
  retorno = 0;
  for (const p of puntos) {
    const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1;
    const f = Math.min(45, 4000 / (d + 60));
    p.vx += (dx / d) * f + aleatorio(-2, 2);
    p.vy += (dy / d) * f + aleatorio(-2, 2);
  }
});

function cargarImagen(src) {
  return new Promise((ok, fallo) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => ok(img);
    img.onerror = fallo;
    img.src = src;
  });
}

// =====================================================================
// 8. ARRANQUE
// =====================================================================
(async function iniciar() {
  document.fonts?.load(`700 20px ${FUENTE}`);   // para las etiquetas del canvas
  try {
    imagenLogo = await cargarImagen(CONFIG.logo.imagen);
  } catch {
    console.warn('No se pudo cargar el logo. Revise la ruta. Si abrió el archivo con doble clic ' +
                 '(file://), use un servidor local (Live Server de VS Code o "npx serve").');
  }
  redimensionar();

  let espera;
  new ResizeObserver(() => {
    clearTimeout(espera);
    espera = setTimeout(() => {
      const r = hero.getBoundingClientRect();
      if (Math.round(r.width) !== ancho || Math.round(r.height) !== alto) redimensionar();
    }, 150);
  }).observe(hero);

  new IntersectionObserver(([entrada]) => {      // pausa cuando la cabecera no se ve
    visible = entrada.isIntersecting;
    if (visible) arrancar();
  }).observe(hero);
})();
</script>
